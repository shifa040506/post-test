<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Monitoring IoT</title>

    <!-- Font modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">

        <header class="header">
            <div class="logo">🌿</div>
            <h1>Monitoring Greenhouse</h1>
            <p class="subtitle">Pantau suhu &amp; kelembapan secara real-time</p>
        </header>

        <div class="status-bar">
            Status: <span id="device-status" class="offline">Offline</span>
            <span class="divider">|</span>
            Terakhir update: <span id="last-update">-</span>
        </div>

        <div class="cards">
            <!-- Kartu Suhu -->
            <div class="card card-suhu" id="card-suhu">
                <div class="card-icon">🌡️</div>
                <h3>Suhu</h3>
                <p class="value"><span id="suhu-val">0</span> °C</p>
            </div>

            <!-- Kartu Kelembapan -->
            <div class="card card-kelembapan" id="card-kelembapan">
                <div class="card-icon">💧</div>
                <h3>Kelembapan</h3>
                <p class="value"><span id="kelembapan-val">0</span> %</p>
            </div>
        </div>

        <!-- Grafik -->
        <div class="panel chart-container">
            <h3 class="panel-title">📈 Grafik Real-time</h3>
            <div class="chart-wrapper">
                <canvas id="myChart"></canvas>
            </div>
        </div>

        <!-- Tabel -->
        <div class="panel table-container">
            <div class="panel-header">
                <h3 class="panel-title">🕒 Riwayat 10 Data Terakhir</h3>
                <!-- Tombol ekspor CSV (unduh lewat JavaScript, tanpa pindah halaman) -->
                <button type="button" id="btn-export" class="btn-export">
                    ⬇️ Unduh CSV
                </button>
            </div>
            <div class="table-scroll">
                <table>
                    <thead>
                        <tr>
                            <th>Waktu</th>
                            <th>Device</th>
                            <th>Suhu (°C)</th>
                            <th>Kelembapan (%)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Diisi via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="footer">IoT Greenhouse Dashboard © 2026</footer>
    </div>

    <!-- Script unduh CSV -->
    <script>
    document.getElementById('btn-export').addEventListener('click', async () => {
        const btn = document.getElementById('btn-export');
        const teksAsli = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '⏳ Menyiapkan...';

        try {
            const res = await fetch('/api/export/csv');
            if (!res.ok) throw new Error(await res.text());

            const blob = await res.blob();
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'riwayat-greenhouse-' + new Date().toISOString().slice(0, 10) + '.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        } catch (err) {
            alert('Gagal mengunduh CSV: ' + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = teksAsli;
        }
    });
    </script>

    <script src="app.js"></script>
</body>

</html>
